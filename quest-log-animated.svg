<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animated quest log for Thaspeeha, styled as a terminal window</title>
<desc>A dark terminal-style card titled "04 // QUEST LOG" listing completed goals: learn computer science, build full-stack applications, explore machine learning, build an explainable AI system, compete in hackathons, NASA Space Apps, build AI and sustainability projects, and graduate with a BSc Hons in Computer Science. In-progress goals: become a stronger AI engineer, build production-ready AI systems, explore agentic AI, contribute to open source, and ship more things. A progress bar animates to show 8 of 13 items complete, 62 percent, over a slower time lapse.</desc>

<defs>
<style>
  .mono { font-family: 'JetBrains Mono','Courier New',monospace; }

  .row { opacity: 0; animation: rowIn 0.7s ease forwards; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .arrow { animation: arrowPulse 1.6s ease-in-out infinite; }
  @keyframes arrowPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  .check { animation: checkPop 0.5s ease forwards; transform-origin: center; }
  @keyframes checkPop {
    0%   { transform: scale(0.4); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .bar-fill { width: 0; animation: fillBar 1.5s ease forwards; animation-delay: 5.2s; }
  @keyframes fillBar { to { width: 474px; } }

  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .scan { animation: sweep 7s linear infinite; animation-delay: 6.8s; }
  @keyframes sweep {
    0%   { transform: translateY(-480px); opacity: 0; }
    5%   { opacity: 0.4; }
    95%  { opacity: 0.4; }
    100% { transform: translateY(480px); opacity: 0; }
  }
</style>
<clipPath id="questCardClip">
  <rect x="0" y="0" width="820" height="480" rx="4"/>
</clipPath>
</defs>

<rect width="900" height="620" fill="#0a0d0a"/>

<text x="40" y="46" class="mono" font-size="15" letter-spacing="2" fill="#5fe38c">04 // QUEST LOG</text>
<rect x="40" y="60" width="820" height="1" fill="#1e2a20"/>

<g transform="translate(40,90)">
  <rect x="0" y="0" width="820" height="480" rx="4" fill="#0f140f" stroke="#2a3b2c" stroke-width="1"/>

  <g clip-path="url(#questCardClip)">
    <rect class="scan" x="0" y="0" width="820" height="60" fill="#3ee673" opacity="0"/>
  </g>

  <line x1="0" y1="60" x2="820" y2="60" stroke="#2a3b2c" stroke-width="1"/>

  <text x="28" y="38" class="mono" font-size="20" letter-spacing="3" fill="#e9fbee" font-weight="bold">QUEST_LOG</text>

  <g class="mono" font-size="14">
    <g class="row" style="animation-delay:0.00s">
      <text x="28" y="92" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="92" fill="#c9dccf">Learn Computer Science</text>
    </g>
    <g class="row" style="animation-delay:0.35s">
      <text x="28" y="116" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="116" fill="#c9dccf">Build full-stack applications</text>
    </g>
    <g class="row" style="animation-delay:0.70s">
      <text x="28" y="140" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="140" fill="#c9dccf">Explore Machine Learning</text>
    </g>
    <g class="row" style="animation-delay:1.05s">
      <text x="28" y="164" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="164" fill="#c9dccf">Build an Explainable AI system</text>
    </g>
    <g class="row" style="animation-delay:1.40s">
      <text x="28" y="188" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="188" fill="#c9dccf">Compete in hackathons</text>
    </g>
    <g class="row" style="animation-delay:1.75s">
      <text x="28" y="212" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="212" fill="#c9dccf">NASA Space Apps</text>
    </g>
    <g class="row" style="animation-delay:2.10s">
      <text x="28" y="236" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="236" fill="#c9dccf">Build AI + sustainability projects</text>
    </g>
    <g class="row" style="animation-delay:2.45s">
      <text x="28" y="260" class="check" fill="#3ee673">[&#10003;]</text>
      <text x="70" y="260" fill="#c9dccf">Graduate with BSc (Hons) Computer Science</text>
    </g>

    <g class="row" style="animation-delay:2.90s">
      <text x="28" y="288" class="arrow" fill="#f2b632">[&#8594;]</text>
      <text x="70" y="288" fill="#e9dcc0">Become a stronger AI Engineer</text>
    </g>
    <g class="row" style="animation-delay:3.25s">
      <text x="28" y="312" class="arrow" fill="#f2b632">[&#8594;]</text>
      <text x="70" y="312" fill="#e9dcc0">Build production-ready AI systems</text>
    </g>
    <g class="row" style="animation-delay:3.60s">
      <text x="28" y="336" class="arrow" fill="#f2b632">[&#8594;]</text>
      <text x="70" y="336" fill="#e9dcc0">Explore Agentic AI</text>
    </g>
    <g class="row" style="animation-delay:3.95s">
      <text x="28" y="360" class="arrow" fill="#f2b632">[&#8594;]</text>
      <text x="70" y="360" fill="#e9dcc0">Contribute to Open Source</text>
    </g>
    <g class="row" style="animation-delay:4.30s">
      <text x="28" y="384" class="arrow" fill="#f2b632">[&#8594;]</text>
      <text x="70" y="384" fill="#e9dcc0">Ship more things</text>
    </g>
  </g>

  <line x1="0" y1="410" x2="820" y2="410" stroke="#2a3b2c" stroke-width="1"/>

  <text x="28" y="440" class="mono" font-size="12" letter-spacing="1" fill="#6b7d6e">PROGRESS &#183; 8/13 COMPLETE &#183; 62%</text>

  <rect x="28" y="450" width="764" height="10" rx="5" fill="#161c17" stroke="#2a3b2c" stroke-width="1"/>
  <rect class="bar-fill" x="28" y="450" height="10" rx="5" fill="#3ee673"/>
</g>

<text x="40" y="590" class="mono" font-size="12" letter-spacing="1" fill="#3d4a3f">&gt; tracking progress<tspan class="cursor">_</tspan></text>
</svg>
