<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animated quest log for Thaspeeha, styled as a deep-space mission console</title>
<desc>A dark cosmic terminal-style card titled "04 // QUEST LOG" listing completed goals: learn computer science, build full-stack applications, explore machine learning, build an explainable AI system, compete in hackathons, NASA Space Apps, build AI and sustainability projects, and graduate with a BSc Hons in Computer Science. In-progress goals: become a stronger AI engineer, build production-ready AI systems, explore agentic AI, contribute to open source, and ship more things. A progress bar animates to show 8 of 13 items complete, 62 percent, over a slower time lapse, against a starfield backdrop.</desc>

<defs>
<style>
  .mono { font-family: 'JetBrains Mono','Courier New',monospace; }

  .row { opacity: 0; animation: rowIn 0.7s ease forwards; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .arrow { animation: arrowPulse 1.6s ease-in-out infinite; }
  @keyframes arrowPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  .check { animation: checkPop 0.5s ease forwards; transform-origin: center; }
  @keyframes checkPop {
    0%   { transform: scale(0.4); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .bar-fill { width: 0; animation: fillBar 1.5s ease forwards; animation-delay: 5.2s; }
  @keyframes fillBar { to { width: 474px; } }

  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .scan { animation: sweep 7s linear infinite; animation-delay: 6.8s; }
  @keyframes sweep {
    0%   { transform: translateY(-480px); opacity: 0; }
    5%   { opacity: 0.35; }
    95%  { opacity: 0.35; }
    100% { transform: translateY(480px); opacity: 0; }
  }

  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }
</style>

<clipPath id="questCardClip">
  <rect x="0" y="0" width="820" height="480" rx="4"/>
</clipPath>

<radialGradient id="spaceBg" cx="30%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#141b3d" />
  <stop offset="45%" stop-color="#0a0e24" />
  <stop offset="100%" stop-color="#03040d" />
</radialGradient>

<linearGradient id="nebula" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#6a3ee6" stop-opacity="0.18" />
  <stop offset="45%" stop-color="#3ea0e6" stop-opacity="0.08" />
  <stop offset="100%" stop-color="#0a0e24" stop-opacity="0" />
</linearGradient>

<linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#3ee6d8" />
  <stop offset="100%" stop-color="#8a6bf2" />
</linearGradient>

<filter id="glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3" result="blur" />
  <feMerge>
    <feMergeNode in="blur" />
    <feMergeNode in="SourceGraphic" />
  </feMerge>
</filter>
<filter id="glow-amber" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3" result="blur" />
  <feMerge>
    <feMergeNode in="blur" />
    <feMergeNode in="SourceGraphic" />
  </feMerge>
</filter>
</defs>

<rect width="900" height="620" fill="url(#spaceBg)"/>

<!-- Starfield -->
<g fill="#bcd0ff">
  <circle class="twinkle" cx="60" cy="30" r="1.2" style="animation-delay:0s" />
  <circle class="twinkle" cx="150" cy="80" r="1" style="animation-delay:0.4s" />
  <circle class="twinkle" cx="320" cy="20" r="1.4" style="animation-delay:0.9s" />
  <circle class="twinkle" cx="470" cy="55" r="1" style="animation-delay:1.3s" />
  <circle class="twinkle" cx="610" cy="15" r="1.2" style="animation-delay:0.2s" />
  <circle class="twinkle" cx="760" cy="45" r="1.5" style="animation-delay:1.6s" />
  <circle class="twinkle" cx="850" cy="20" r="1" style="animation-delay:0.7s" />
  <circle class="twinkle" cx="20" cy="200" r="1.1" style="animation-delay:1.1s" />
  <circle class="twinkle" cx="880" cy="180" r="1.3" style="animation-delay:0.5s" />
  <circle class="twinkle" cx="870" cy="400" r="1" style="animation-delay:1.9s" />
  <circle class="twinkle" cx="15" cy="480" r="1.2" style="animation-delay:0.3s" />
  <circle class="twinkle" cx="30" cy="580" r="1" style="animation-delay:1.4s" />
  <circle class="twinkle" cx="860" cy="560" r="1.4" style="animation-delay:0.8s" />
  <circle class="twinkle" cx="500" cy="600" r="1" style="animation-delay:1.2s" />
  <circle class="twinkle" cx="700" cy="590" r="1.2" style="animation-delay:0.6s" />
</g>

<!-- Distant planet accent -->
<circle cx="855" cy="60" r="16" fill="#3ea0e6" opacity="0.35" filter="url(#glow-cyan)"/>
<circle cx="855" cy="60" r="16" fill="none" stroke="#8a6bf2" stroke-width="0.75" opacity="0.5"/>

<text x="40" y="46" class="mono" font-size="15" letter-spacing="2" fill="#4fe0e6">07 // QUEST LOG</text>
<rect x="40" y="60" width="820" height="1" fill="#26305c"/>

<g transform="translate(40,90)">
  <rect x="0" y="0" width="820" height="480" rx="4" fill="#0b1030" stroke="#2c3a72" stroke-width="1"/>
  <rect x="0" y="0" width="820" height="480" rx="4" fill="url(#nebula)"/>

  <g clip-path="url(#questCardClip)">
    <rect class="scan" x="0" y="0" width="820" height="60" fill="#4fe0e6" opacity="0"/>
  </g>

  <line x1="0" y1="60" x2="820" y2="60" stroke="#2c3a72" stroke-width="1"/>

  <text x="28" y="38" class="mono" font-size="20" letter-spacing="3" fill="#eaf2ff" font-weight="bold">QUEST_LOG</text>

  <g class="mono" font-size="14">
    <g class="row" style="animation-delay:0.00s">
      <text x="28" y="92" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="92" fill="#c7d3f2">Learn Computer Science</text>
    </g>
    <g class="row" style="animation-delay:0.35s">
      <text x="28" y="116" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="116" fill="#c7d3f2">Build full-stack applications</text>
    </g>
    <g class="row" style="animation-delay:0.70s">
      <text x="28" y="140" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="140" fill="#c7d3f2">Explore Machine Learning</text>
    </g>
    <g class="row" style="animation-delay:1.05s">
      <text x="28" y="164" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="164" fill="#c7d3f2">Build an Explainable AI system</text>
    </g>
    <g class="row" style="animation-delay:1.40s">
      <text x="28" y="188" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="188" fill="#c7d3f2">Compete in hackathons</text>
    </g>
    <g class="row" style="animation-delay:1.75s">
      <text x="28" y="212" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="212" fill="#c7d3f2">NASA Space Apps</text>
    </g>
    <g class="row" style="animation-delay:2.10s">
      <text x="28" y="236" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="236" fill="#c7d3f2">Build AI + sustainability projects</text>
    </g>
    <g class="row" style="animation-delay:2.45s">
      <text x="28" y="260" class="check" fill="#4fe0e6" filter="url(#glow-cyan)">[&#10003;]</text>
      <text x="70" y="260" fill="#c7d3f2">Graduate with BSc (Hons) Computer Science</text>
    </g>

    <g class="row" style="animation-delay:2.90s">
      <text x="28" y="288" class="arrow" fill="#c99bf2" filter="url(#glow-amber)">[&#8594;]</text>
      <text x="70" y="288" fill="#dccdf5">Become a stronger AI Engineer</text>
    </g>
    <g class="row" style="animation-delay:3.25s">
      <text x="28" y="312" class="arrow" fill="#c99bf2" filter="url(#glow-amber)">[&#8594;]</text>
      <text x="70" y="312" fill="#dccdf5">Build production-ready AI systems</text>
    </g>
    <g class="row" style="animation-delay:3.60s">
      <text x="28" y="336" class="arrow" fill="#c99bf2" filter="url(#glow-amber)">[&#8594;]</text>
      <text x="70" y="336" fill="#dccdf5">Explore Agentic AI</text>
    </g>
    <g class="row" style="animation-delay:3.95s">
      <text x="28" y="360" class="arrow" fill="#c99bf2" filter="url(#glow-amber)">[&#8594;]</text>
      <text x="70" y="360" fill="#dccdf5">Contribute to Open Source</text>
    </g>
    <g class="row" style="animation-delay:4.30s">
      <text x="28" y="384" class="arrow" fill="#c99bf2" filter="url(#glow-amber)">[&#8594;]</text>
      <text x="70" y="384" fill="#dccdf5">Ship more things</text>
    </g>
  </g>

  <line x1="0" y1="410" x2="820" y2="410" stroke="#2c3a72" stroke-width="1"/>

  <text x="28" y="440" class="mono" font-size="12" letter-spacing="1" fill="#7c8ac2">PROGRESS &#183; 8/13 COMPLETE &#183; 62%</text>

  <rect x="28" y="450" width="764" height="10" rx="5" fill="#131a3f" stroke="#2c3a72" stroke-width="1"/>
  <rect class="bar-fill" x="28" y="450" height="10" rx="5" fill="url(#barGrad)"/>
</g>

<text x="40" y="590" class="mono" font-size="12" letter-spacing="1" fill="#4a5586">&gt; tracking progress<tspan class="cursor">_</tspan></text>
</svg>
