<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>System status card for Thaspeeha, styled as a terminal window</title>
<desc>A dark terminal-style card titled "01 // SYSTEM STATUS" showing THASPEEHA.EXE with status online, role AI/Software Engineer, education BSc Hons Computer Science, focus AI ML Backend Full-Stack, base UAE, mode building.</desc>

<rect width="900" height="480" fill="#0a0d0a"/>

<text x="40" y="46" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" letter-spacing="2" fill="#5fe38c">01 // SYSTEM STATUS</text>
<rect x="40" y="60" width="820" height="1" fill="#1e2a20"/>

<g transform="translate(40,90)">
  <rect x="0" y="0" width="820" height="330" rx="4" fill="#0f140f" stroke="#2a3b2c" stroke-width="1"/>

  <line x1="0" y1="60" x2="820" y2="60" stroke="#2a3b2c" stroke-width="1"/>

  <text x="28" y="38" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" letter-spacing="3" fill="#e9fbee" font-weight="bold">THASPEEHA.EXE</text>

  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="15">
    <text x="28" y="98" fill="#6b7d6e" letter-spacing="1">STATUS</text>
    <circle cx="230" cy="93" r="5" fill="#3ee673"/>
    <text x="246" y="98" fill="#3ee673" letter-spacing="1">ONLINE</text>

    <text x="28" y="138" fill="#6b7d6e" letter-spacing="1">ROLE</text>
    <text x="230" y="138" fill="#dff3e3" letter-spacing="0.5">AI / SOFTWARE ENGINEER</text>

    <text x="28" y="178" fill="#6b7d6e" letter-spacing="1">EDUCATION</text>
    <text x="230" y="178" fill="#dff3e3" letter-spacing="0.5">BSc (Hons) Computer Science</text>

    <text x="28" y="218" fill="#6b7d6e" letter-spacing="1">FOCUS</text>
    <text x="230" y="218" fill="#dff3e3" letter-spacing="0.5">AI · ML · Backend · Full-Stack</text>

    <text x="28" y="258" fill="#6b7d6e" letter-spacing="1">BASE</text>
    <text x="230" y="258" fill="#dff3e3" letter-spacing="0.5">UAE</text>

    <text x="28" y="298" fill="#6b7d6e" letter-spacing="1">MODE</text>
    <text x="230" y="298" fill="#5fe38c" letter-spacing="1">BUILDING</text>
  </g>
</g>

<text x="40" y="450" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="1" fill="#3d4a3f">&gt; last sync: now_</text>
</svg>
