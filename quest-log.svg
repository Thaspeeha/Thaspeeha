        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
            <defs>
                <style>
                    /* Base font styling */
                    .text {
                        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
                        font-size: 14px;
                        fill: #c9d1d9;
                    }
                    
                    /* Header styling */
                    .header {
                        font-weight: bold;
                        font-size: 16px;
                        fill: #58a6ff; /* GitHub Blue */
                    }
                    
                    /* Completed tasks styling */
                    .completed-box {
                        fill: #2ea043; /* GitHub Green */
                        font-weight: bold;
                    }
                    
                    /* In-progress tasks styling */
                    .progress-box {
                        fill: #d2a8ff; /* GitHub Purple */
                        font-weight: bold;
                    }
                    
                    /* Secondary text color */
                    .muted {
                        fill: #8b949e;
                    }

                    /* Typing effect animation */
                    @keyframes typing {
                        from { width: 0; }
                        to { width: 100%; }
                    }

                    /* Blinking cursor effect */
                    @keyframes blink-caret {
                        from, to { border-color: transparent }
                        50% { border-color: #58a6ff; }
                    }

                    /* Fade in for completed tasks (staggered) */
                    @keyframes fadeIn {
                        0% { opacity: 0; transform: translateX(-10px); }
                        100% { opacity: 1; transform: translateX(0); }
                    }

                    /* Pulse animation for active quests - changed to a slight rightward nudge for stability */
                    @keyframes pulse {
                        0%, 100% { fill: #d2a8ff; transform: translateX(0); }
                        50% { fill: #a371f7; transform: translateX(3px); }
                    }

                    /* Applying animations to specific groups */
                    .stagger-1 { animation: fadeIn 0.5s ease-out 0.2s both; }
                    .stagger-2 { animation: fadeIn 0.5s ease-out 0.4s both; }
                    .stagger-3 { animation: fadeIn 0.5s ease-out 0.6s both; }
                    .stagger-4 { animation: fadeIn 0.5s ease-out 0.8s both; }
                    .stagger-5 { animation: fadeIn 0.5s ease-out 1.0s both; }
                    .stagger-6 { animation: fadeIn 0.5s ease-out 1.2s both; }
                    .stagger-7 { animation: fadeIn 0.5s ease-out 1.4s both; }
                    .stagger-8 { animation: fadeIn 0.5s ease-out 1.6s both; }
                    
                    .stagger-9 { animation: fadeIn 0.5s ease-out 2.2s both; }
                    .stagger-10 { animation: fadeIn 0.5s ease-out 2.6s both; }
                    .stagger-11 { animation: fadeIn 0.5s ease-out 3.0s both; }
                    .stagger-12 { animation: fadeIn 0.5s ease-out 3.4s both; }

                    /* Animate the arrows of current quests */
                    .animate-arrow {
                        animation: pulse 2s infinite ease-in-out;
                        transform-origin: left center;
                    }
                </style>
            </defs>

            <!-- Background rect (optional, remove if you want it transparent in README) -->
            <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
            <rect width="100%" height="100%" fill="none" stroke="#30363d" stroke-width="2" rx="8"/>

            <g transform="translate(20, 40)">
                <!-- Simulate a terminal prompt or header -->
                <text class="text header" x="0" y="0">- 04 // QUEST LOG</text>
                <line x1="0" y1="10" x2="200" y2="10" stroke="#30363d" stroke-width="1" stroke-dasharray="4" />
            </g>

            <!-- COMPLETED QUESTS -->
            <g transform="translate(20, 80)">
                <g transform="translate(0, 0)">
                    <g class="stagger-1">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Learn Computer Science</text>
                    </g>
                </g>
                <g transform="translate(0, 25)">
                    <g class="stagger-2">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Build full-stack applications</text>
                    </g>
                </g>
                <g transform="translate(0, 50)">
                    <g class="stagger-3">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Explore Machine Learning</text>
                    </g>
                </g>
                <g transform="translate(0, 75)">
                    <g class="stagger-4">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Build an Explainable AI system</text>
                    </g>
                </g>
                <g transform="translate(0, 100)">
                    <g class="stagger-5">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Compete in hackathons</text>
                    </g>
                </g>
                <g transform="translate(0, 125)">
                    <g class="stagger-6">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">NASA Space Apps</text>
                    </g>
                </g>
                <g transform="translate(0, 150)">
                    <g class="stagger-7">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Build AI + sustainability projects</text>
                    </g>
                </g>
                <g transform="translate(0, 175)">
                    <g class="stagger-8">
                        <text class="text completed-box" x="0" y="0">[✓]</text>
                        <text class="text muted" x="35" y="0">Graduate with BSc (Hons) Computer Science</text>
                    </g>
                </g>
            </g>

            <!-- ACTIVE QUESTS -->
            <g transform="translate(20, 290)">
                <g transform="translate(0, 0)">
                    <g class="stagger-9">
                        <text class="text progress-box animate-arrow" x="0" y="0">[→]</text>
                        <text class="text" x="35" y="0">Become a stronger AI Engineer</text>
                    </g>
                </g>
                <g transform="translate(0, 25)">
                    <g class="stagger-10">
                        <text class="text progress-box animate-arrow" x="0" y="0">[→]</text>
                        <text class="text" x="35" y="0">Build production-ready AI systems</text>
                    </g>
                </g>
                <g transform="translate(0, 50)">
                    <g class="stagger-11">
                        <text class="text progress-box animate-arrow" x="0" y="0">[→]</text>
                        <text class="text" x="35" y="0">Contribute to Open Source</text>
                    </g>
                </g>
                <g transform="translate(0, 75)">
                    <g class="stagger-12">
                        <text class="text progress-box animate-arrow" x="0" y="0">[→]</text>
                        <text class="text" x="35" y="0">Ship more things</text>
                        <!-- Blinking cursor nicely aligned at the end of the text -->
                        <rect x="172" y="-12" width="8" height="15" fill="#58a6ff">
                            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
                        </rect>
                    </g>
                </g>
            </g>
        </svg>