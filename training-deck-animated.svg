<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #090C15; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1423" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Planet 1: Samsung (Completed - Cyan/Blue) -->
    <radialGradient id="planet-samsung" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#73F6FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="95%" stop-color="#051538" />
    </radialGradient>

    <!-- Planet 2: AWS (Active - Amber/Orange/Gold) -->
    <radialGradient id="planet-aws" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="40%" stop-color="#FF9900" />
      <stop offset="85%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#2A0800" />
    </radialGradient>
    
    <!-- Trajectory Line Gradient -->
    <linearGradient id="traj-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FF9900" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFD000" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Dynamic CSS Animations -->
  <style>
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulse-ring {
      0% { r: 45px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 85px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .grid-line { stroke: #1A2338; stroke-width: 1; opacity: 0.4; }
    .traj-path { stroke: url(#traj-grad); stroke-width: 2.5; stroke-dasharray: 8 6; animation: dash 2s linear infinite; }
    .pulse-circle { animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; transform-box: fill-box; transform-origin: center; }
    .radar-sweep { transform-box: fill-box; transform-origin: center; animation: rotate-radar 7s linear infinite; }
    .status-blink { animation: blink 1.5s ease-in-out infinite; }
    .hud-text { fill: #8E9BAE; font-size: 10px; letter-spacing: 1px; }
    .title-text { fill: #FFFFFF; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
    .tag-text { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bg-grid)" />

  <!-- Grid Map Pattern -->
  <g class="grid-layer">
    <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="800" y2="300" class="grid-line" />
    <line x1="0" y1="400" x2="800" y2="400" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="500" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="500" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="500" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="500" class="grid-line" />
  </g>

  <!-- Stars / Background Constellations -->
  <g fill="#4A5A80" opacity="0.6">
    <circle cx="80" cy="70" r="1" />
    <circle cx="280" cy="120" r="1.5" />
    <circle cx="420" cy="60" r="1" />
    <circle cx="720" cy="110" r="1.5" />
    <circle cx="110" cy="420" r="1" />
    <circle cx="510" cy="440" r="1.5" />
    <circle cx="670" cy="320" r="1" />
    <circle cx="370" cy="240" r="1" />
  </g>

  <!-- HUD Overlay Header -->
  <g transform="translate(30, 35)">
    <text x="0" y="0" class="hud-text" fill="#00F0FF" font-weight="bold">// SYSTEM: NAV-ORBITAL // SECTOR 08</text>
    <text x="0" y="16" class="title-text" fill="#FFFFFF">TRAINING DECK — OPERATOR EXPANSION MAP</text>
    <line x1="0" y1="26" x2="740" y2="26" stroke="#1E2A45" stroke-width="1.5" />
    <line x1="0" y1="26" x2="180" y2="26" stroke="#00F0FF" stroke-width="1.5" />
  </g>

  <!-- Orbital Flight Trajectory Curve -->
  <path d="M 200 270 Q 380 380 580 200" fill="none" class="traj-path" />
  <path d="M 580 200 Q 670 120 730 150" fill="none" stroke="#2A3855" stroke-dasharray="4 4" stroke-width="1.5" />

  <!-- Animated Waypoint Explorer Craft (Probe) -->
  <g>
    <path d="M -8 -5 L 8 0 L -8 5 L -4 0 Z" fill="#00FF9D" filter="url(#glow-cyan)">
      <animateMotion path="M 200 270 Q 380 380 580 200" rotate="auto" dur="6s" repeatCount="indefinite" />
    </path>
    <circle r="4" fill="none" stroke="#00FF9D" stroke-width="1.5" opacity="0.8">
      <animateMotion path="M 200 270 Q 380 380 580 200" rotate="auto" dur="6s" repeatCount="indefinite" />
      <animate attributeName="r" values="2;12;2" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================= PLANET 1: SAMSUNG (COMPLETED) ================= -->
  <g transform="translate(200, 270)">
    <!-- Orbit Rings -->
    <ellipse rx="65" ry="22" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.25" transform="rotate(-15)" />
    <ellipse rx="65" ry="22" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="20 10" opacity="0.6" transform="rotate(-15)" />

    <!-- Planet Body -->
    <circle r="36" fill="url(#planet-samsung)" filter="url(#glow-cyan)" />
    <circle r="36" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6" />
    
    <!-- Satellite Icon on Orbit -->
    <circle cx="-58" cy="12" r="4" fill="#00F0FF" filter="url(#glow-cyan)" />
    <line x1="-58" y1="12" x2="-25" y2="5" stroke="#00F0FF" stroke-width="0.8" opacity="0.4" />

    <!-- Completion Badge -->
    <circle cx="24" cy="-24" r="12" fill="#090C15" stroke="#00F0FF" stroke-width="1.5" />
    <path d="M 19 -24 L 22 -21 L 28 -27" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Info Card HUD (Samsung) -->
    <g transform="translate(-160, 55)">
      <rect x="0" y="0" width="220" height="92" rx="6" fill="#0D1220" fill-opacity="0.9" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
      <path d="M 0 6 L 0 0 L 220 0 L 220 6" fill="none" stroke="#00F0FF" stroke-width="2" />
      
      <text x="12" y="18" class="tag-text" fill="#00F0FF">● COMPLETED COURSE</text>
      <text x="12" y="36" class="title-text" fill="#FFFFFF">Samsung Innovation Campus</text>
      <text x="12" y="50" class="hud-text" fill="#A0AEC0">OCT 2025 — JAN 2026</text>
      
      <!-- Skills Badges -->
      <rect x="12" y="62" width="45" height="16" rx="3" fill="#162238" stroke="#00F0FF" stroke-opacity="0.3" />
      <text x="34" y="73" text-anchor="middle" font-size="8" fill="#73F6FF" font-weight="bold">AI/ML</text>
      
      <rect x="62" y="62" width="60" height="16" rx="3" fill="#162238" stroke="#00F0FF" stroke-opacity="0.3" />
      <text x="92" y="73" text-anchor="middle" font-size="8" fill="#73F6FF" font-weight="bold">MODEL DEV</text>
      
      <rect x="127" y="62" width="60" height="16" rx="3" fill="#162238" stroke="#00F0FF" stroke-opacity="0.3" />
      <text x="157" y="73" text-anchor="middle" font-size="8" fill="#73F6FF" font-weight="bold">APPLIED AI</text>
    </g>
  </g>

  <!-- ================= PLANET 2: AWS (ACTIVE / IN PROGRESS) ================= -->
  <g transform="translate(580, 200)">
    <!-- Expanding Active Radar Sonar Rings -->
    <circle r="45" fill="none" stroke="#FF9900" class="pulse-circle" />
    <circle r="60" fill="none" stroke="#FFD000" class="pulse-circle" style="animation-delay: 1s;" />

    <!-- Outer Tech Reticle / Target Ring -->
    <circle r="52" fill="none" stroke="#FF9900" stroke-width="1" stroke-dasharray="6 6" opacity="0.6" />
    <circle r="58" fill="none" stroke="#FFD000" stroke-width="1.5" stroke-dasharray="40 20 10 20" class="radar-sweep" />

    <!-- Target Lock Crosshairs -->
    <path d="M -65 0 L -52 0 M 52 0 L 65 0 M 0 -65 L 0 -52 M 0 52 L 0 65" stroke="#FF9900" stroke-width="1.5" />

    <!-- Planet Body -->
    <circle r="40" fill="url(#planet-aws)" filter="url(#glow-amber)" />
    <circle r="40" fill="none" stroke="#FFD000" stroke-width="1.5" opacity="0.8" />

    <!-- Active Beacon -->
    <circle cx="28" cy="-28" r="10" fill="#090C15" stroke="#FF9900" stroke-width="1.5" />
    <circle cx="28" cy="-28" r="4" fill="#FF9900" class="status-blink" filter="url(#glow-amber)" />

    <!-- Info Card HUD (AWS) -->
    <g transform="translate(-110, -165)">
      <rect x="0" y="0" width="235" height="106" rx="6" fill="#140E0A" fill-opacity="0.9" stroke="#FF9900" stroke-width="1.5" />
      <path d="M 0 0 L 235 0 L 235 4 L 0 4 Z" fill="#FF9900" />
      
      <circle cx="16" cy="18" r="4" fill="#FF9900" class="status-blink" />
      <text x="26" y="21" class="tag-text" fill="#FF9900">ACTIVE EXPLORATION // IN-PROGRESS</text>
      
      <text x="12" y="40" class="title-text" fill="#FFFFFF">AWS AI Programmer</text>
      <text x="12" y="54" class="hud-text" fill="#FFD000" font-weight="bold">Udacity × AWS</text>
      <text x="12" y="68" class="hud-text" fill="#A0AEC0">AUG 2026 — PRESENT</text>
      
      <!-- Skill Pills -->
      <rect x="12" y="78" width="28" height="16" rx="3" fill="#2A1800" stroke="#FF9900" stroke-opacity="0.4" />
      <text x="26" y="89" text-anchor="middle" font-size="8" fill="#FFB700" font-weight="bold">AI</text>
      
      <rect x="44" y="78" width="48" height="16" rx="3" fill="#2A1800" stroke="#FF9900" stroke-opacity="0.4" />
      <text x="68" y="89" text-anchor="middle" font-size="8" fill="#FFB700" font-weight="bold">PYTHON</text>

      <rect x="96" y="78" width="34" height="16" rx="3" fill="#2A1800" stroke="#FF9900" stroke-opacity="0.4" />
      <text x="113" y="89" text-anchor="middle" font-size="8" fill="#FFB700" font-weight="bold">AWS</text>

      <rect x="134" y="78" width="88" height="16" rx="3" fill="#2A1800" stroke="#FF9900" stroke-opacity="0.4" />
      <text x="178" y="89" text-anchor="middle" font-size="8" fill="#FFB700" font-weight="bold">MACHINE LEARNING</text>
    </g>
  </g>

  <!-- ================= UNEXPLORED FUTURE NODE ================= -->
  <g transform="translate(720, 360)" opacity="0.45">
    <circle r="22" fill="none" stroke="#5A6B8C" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle r="6" fill="#3B4A6B" />
    <text x="0" y="38" text-anchor="middle" font-size="8" fill="#7A8B9E" font-family="monospace">NEXT_SECTOR</text>
  </g>

  <!-- Footer HUD Telemetry Data -->
  <g transform="translate(30, 475)">
    <text x="0" y="0" class="hud-text" fill="#4A5A80">COORD: 24.89°N / 67.01°E  |  TARGET ACQUIRED: AWS_AI_ND  |  TRAJECTORY: EXPANDING CAPABILITIES</text>
  </g>
</svg>
