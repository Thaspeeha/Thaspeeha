<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="auto" style="background: #07090e; font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
    
    <radialGradient id="aws-planet-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <radialGradient id="samsung-planet-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <radialGradient id="core-sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-signal {
      0% { r: 24px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 55px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes float-p1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes float-p2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { transform: translateY(520px); opacity: 0.3; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* CSS Class Assignments */
    .orbit-ring { transform-origin: 210px 280px; }
    .orbit-cw { animation: spin-cw 40s linear infinite; }
    .orbit-ccw { animation: spin-ccw 55s linear infinite; }
    .radar-line { transform-origin: 210px 280px; animation: radar-sweep 12s linear infinite; }
    
    .planet-aws { animation: float-p1 6s ease-in-out infinite; }
    .planet-samsung { animation: float-p2 7s ease-in-out infinite; }
    
    .pulse-wave { animation: pulse-signal 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    .star-1 { animation: twinkle 3s ease-in-out infinite; }
    .star-2 { animation: twinkle 4.5s ease-in-out infinite 1s; }
    .star-3 { animation: twinkle 2.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="520" fill="url(#space-bg)" rx="12" />
  
  <!-- Outer Card Frame / Sci-Fi HUD Borders -->
  <rect x="15" y="15" width="820" height="490" fill="none" stroke="#1e293b" stroke-width="1.5" rx="8" />
  <path d="M 15 35 L 35 15 M 835 35 L 815 15 M 15 485 L 35 505 M 835 485 L 815 505" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  
  <!-- Grid Lines -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 100 L 850 100 M 0 200 L 850 200 M 0 300 L 850 300 M 0 400 L 850 400" />
    <path d="M 150 0 L 150 520 M 300 0 L 300 520 M 450 0 L 450 520 M 600 0 L 600 520 M 750 0 L 750 520" />
  </g>

  <!-- Starfield background -->
  <g fill="#ffffff">
    <circle cx="80" cy="90" r="1" class="star-1" />
    <circle cx="220" cy="60" r="1.5" class="star-2" />
    <circle cx="380" cy="120" r="1" class="star-3" />
    <circle cx="120" cy="420" r="1.5" class="star-1" />
    <circle cx="340" cy="450" r="1" class="star-2" />
    <circle cx="780" cy="80" r="1.5" class="star-3" />
    <circle cx="480" cy="480" r="1" class="star-1" />
    <circle cx="70" cy="270" r="1.5" class="star-2" />
  </g>

  <!-- HEADER SECTION -->
  <g transform="translate(35, 45)">
    <text x="0" y="0" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="2">07 // TRAINING DECK</text>
    <text x="0" y="22" fill="#94a3b8" font-size="12" font-style="italic">Expanding the operator's capabilities.</text>
    <!-- Header Decorator Line -->
    <path d="M 0 32 L 780 32" stroke="#334155" stroke-width="1" />
    <path d="M 0 32 L 180 32" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
  </g>

  <!-- ORBITAL SYSTEM GRAPHIC (LEFT SIDE) -->
  <g transform="translate(0, 0)">
    <!-- Central System Core / Operator Star -->
    <circle cx="210" cy="280" r="16" fill="url(#core-sun-grad)" filter="url(#glow-amber)" />
    <circle cx="210" cy="280" r="22" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <text x="210" y="312" fill="#d97706" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">OPERATOR CORE</text>

    <!-- Radar Sweep Line -->
    <g class="radar-line">
      <path d="M 210 280 L 370 280" stroke="url(#aws-planet-grad)" stroke-width="1.5" opacity="0.4" />
    </g>

    <!-- Orbit Tracks -->
    <circle cx="210" cy="280" r="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="210" cy="280" r="150" fill="none" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Animated Orbit Ring Elements -->
    <g class="orbit-ring orbit-cw">
      <circle cx="210" cy="190" r="3" fill="#38bdf8" />
      <path d="M 120 280 A 90 90 0 0 1 300 280" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="20 40" opacity="0.5" />
    </g>
    
    <g class="orbit-ring orbit-ccw">
      <circle cx="360" cy="280" r="3.5" fill="#10b981" />
      <path d="M 210 130 A 150 150 0 0 1 360 280" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="40 80" opacity="0.4" />
    </g>

    <!-- PLANET 1: ACTIVE (AWS AI Programmer) -->
    <!-- Positioned at angle on Orbit 1: (cx: 285, cy: 230) -->
    <g transform="translate(285, 230)" class="planet-aws">
      <!-- Active Signal Beacon Pulse -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" class="pulse-wave" />
      
      <!-- Planet Ring System -->
      <ellipse cx="0" cy="0" rx="34" ry="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" transform="rotate(-15)" filter="url(#glow-cyan)" />
      
      <!-- Planet Body -->
      <circle cx="0" cy="0" r="18" fill="url(#aws-planet-grad)" filter="url(#glow-cyan)" />
      
      <!-- Ring Foreground Overlay -->
      <path d="M -32 3 A 34 10 0 0 0 30 -5" fill="none" stroke="#7dd3fc" stroke-width="2" transform="rotate(-15)" />

      <!-- Active Reticle / Target Hud -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8 4" />
      
      <!-- Planet Label Pin Line -->
      <path d="M 18 -10 L 45 -35 L 115 -35" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <circle cx="115" cy="-35" r="2.5" fill="#38bdf8" />
      <text x="50" y="-42" fill="#7dd3fc" font-size="10" font-weight="bold" letter-spacing="1">TARGET: ACTIVE</text>
    </g>

    <!-- PLANET 2: COMPLETED (Samsung Innovation Campus) -->
    <!-- Positioned on Orbit 2: (cx: 110, cy: 370) -->
    <g transform="translate(110, 370)" class="planet-samsung">
      <!-- Planet Body -->
      <circle cx="0" cy="0" r="22" fill="url(#samsung-planet-grad)" filter="url(#glow-green)" />
      
      <!-- Tech Grid Overlay on Planet -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.4" stroke-dasharray="4 2" />
      <ellipse cx="0" cy="0" rx="22" ry="7" fill="none" stroke="#a7f3d0" stroke-width="1" opacity="0.5" />

      <!-- Orbit Lock Badge -->
      <circle cx="14" cy="-14" r="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <path d="M 11 -14 L 13 -12 L 17 -16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Planet Label Pin Line -->
      <path d="M -15 15 L -35 35 L -80 35" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7" />
      <circle cx="-80" cy="35" r="2.5" fill="#10b981" />
      <text x="-78" y="28" fill="#6ee7b7" font-size="9" font-weight="bold" letter-spacing="1">ORBIT LOCKED</text>
    </g>
  </g>

  <!-- DATA PANELS / COURSE CARDS (RIGHT SIDE) -->
  <g transform="translate(420, 105)">
    
    <!-- CARD 1: ACTIVE TRAINING -->
    <g transform="translate(0, 0)">
      <!-- Panel Background -->
      <rect x="0" y="0" width="395" height="170" fill="#0f172a" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5" rx="6" filter="url(#glow-cyan)" />
      <!-- Cut Corner Accent -->
      <path d="M 375 0 L 395 20 L 395 170 L 0 170 L 0 0 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 370 0 L 395 25" stroke="#38bdf8" stroke-width="3" />

      <!-- Status Header Pill -->
      <rect x="16" y="16" width="125" height="20" fill="#0c4a6e" rx="4" stroke="#0369a1" stroke-width="1" />
      <circle cx="26" cy="26" r="4" fill="#38bdf8" class="star-1" />
      <text x="36" y="30" fill="#38bdf8" font-size="10" font-weight="bold" letter-spacing="1">ACTIVE MODULE</text>

      <!-- Date Badge -->
      <text x="380" y="30" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="0.5">AUG 2026 — PRESENT</text>

      <!-- Course Title & Subtitle -->
      <text x="16" y="60" fill="#f8fafc" font-size="15" font-weight="bold">AWS AI Programmer Nanodegree</text>
      <text x="16" y="78" fill="#38bdf8" font-size="12" font-weight="600">Udacity × AWS</text>

      <!-- Divider -->
      <line x1="16" y1="92" x2="378" y2="92" stroke="#1e293b" stroke-width="1" />

      <!-- Tags -->
      <g transform="translate(16, 108)">
        <!-- Tag 1 -->
        <rect x="0" y="0" width="32" height="22" fill="#1e293b" rx="3" stroke="#334155" stroke-width="1" />
        <text x="16" y="15" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">AI</text>
        
        <!-- Tag 2 -->
        <rect x="38" y="0" width="62" height="22" fill="#1e293b" rx="3" stroke="#334155" stroke-width="1" />
        <text x="69" y="15" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">PYTHON</text>
        
        <!-- Tag 3 -->
        <rect x="106" y="0" width="42" height="22" fill="#1e293b" rx="3" stroke="#334155" stroke-width="1" />
        <text x="127" y="15" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">AWS</text>
        
        <!-- Tag 4 -->
        <rect x="154" y="0" width="135" height="22" fill="#1e293b" rx="3" stroke="#334155" stroke-width="1" />
        <text x="221" y="15" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">MACHINE LEARNING</text>
      </g>

      <!-- Progress Bar indicator -->
      <g transform="translate(16, 148)">
        <text x="0" y="0" fill="#64748b" font-size="9" font-weight="bold">TELEMETRY: RECORDING</text>
        <rect x="130" y="-8" width="230" height="6" fill="#1e293b" rx="3" />
        <rect x="130" y="-8" width="140" height="6" fill="#38bdf8" rx="3" filter="url(#glow-cyan)" />
      </g>
    </g>

    <!-- CARD 2: COMPLETED TRAINING -->
    <g transform="translate(0, 195)">
      <!-- Panel Background -->
      <rect x="0" y="0" width="395" height="160" fill="#062e24" fill-opacity="0.4" stroke="#059669" stroke-width="1.2" rx="6" />
      <path d="M 375 0 L 395 20 L 395 160 L 0 160 L 0 0 Z" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.8" />

      <!-- Status Header Pill -->
      <rect x="16" y="16" width="150" height="20" fill="#064e3b" rx="4" stroke="#047857" stroke-width="1" />
      <circle cx="26" cy="26" r="4" fill="#34d399" />
      <text x="36" y="30" fill="#34d399" font-size="10" font-weight="bold" letter-spacing="1">MISSION COMPLETED</text>

      <!-- Date Badge -->
      <text x="380" y="30" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="0.5">OCT 2025 — JAN 2026</text>

      <!-- Course Title -->
      <text x="16" y="60" fill="#f8fafc" font-size="15" font-weight="bold">Samsung Innovation Campus — AI</text>
      <text x="16" y="78" fill="#34d399" font-size="11" font-weight="500">Certified Specialization</text>

      <!-- Divider -->
      <line x1="16" y1="90" x2="378" y2="90" stroke="#134e3a" stroke-width="1" />

      <!-- Tags -->
      <g transform="translate(16, 105)">
        <!-- Tag 1 -->
        <rect x="0" y="0" width="50" height="22" fill="#064e3b" rx="3" stroke="#047857" stroke-width="1" />
        <text x="25" y="15" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">AI/ML</text>
        
        <!-- Tag 2 -->
        <rect x="56" y="0" width="140" height="22" fill="#064e3b" rx="3" stroke="#047857" stroke-width="1" />
        <text x="126" y="15" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">MODEL DEVELOPMENT</text>
        
        <!-- Tag 3 -->
        <rect x="202" y="0" width="90" height="22" fill="#064e3b" rx="3" stroke="#047857" stroke-width="1" />
        <text x="247" y="15" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">APPLIED AI</text>
      </g>
    </g>

  </g>

  <!-- FOOTER STATS / HUD DECORATION -->
  <g transform="translate(35, 485)">
    <text x="0" y="0" fill="#475569" font-size="9" font-weight="bold" letter-spacing="1.5">SYSTEM STATUS: ONLINE</text>
    <text x="250" y="0" fill="#475569" font-size="9" font-weight="bold" letter-spacing="1.5">ORBITAL SECTOR: 07-TRAINING</text>
    <text x="780" y="0" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="end" letter-spacing="1.5">SYNC 100%</text>
  </g>
</svg>
